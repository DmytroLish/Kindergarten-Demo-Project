upstream frontend{
    server frontend:3000;
}

upstream student{
    server student:5001;
}

upstream teacher{
    server teacher:5002;
}

upstream employee{
    server employee:5003;
}

server{
    listen 80;

    location / {
        proxy_pass http://frontend;
    }
    location /api/student {
        rewrite /api/student/(.*) /$1 break;
        proxy_pass http://student;
    }
    location /api/teacher {
        rewrite /api/teacher/(.*) /$1 break;
        proxy_pass http://teacher;
    }
    location /api/employee {
        rewrite /api/employee/(.*) /$1 break;
        proxy_pass http://employee;
    }

}
